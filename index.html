<script>
window.__LOCAL_MODE = (function () {
  var h = location.hostname;
  return location.protocol === 'file:' ||
         h === 'localhost' || h === '127.0.0.1' || h === '' ||
         /^192\.168\./.test(h) || /^10\./.test(h) ||
         /^172\.(1[6-9]|2\d|3[01])\./.test(h);
})();
if (window.__LOCAL_MODE) {
